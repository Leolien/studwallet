<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudWallet</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>StudWallet (develop)</h1>
  </header>

  <main class="layout">

    <!-- Colonne principale -->
    <section class="colonne-principale">

      <div class="carte carte-solde">
        <p>Solde actuel</p>
        <p id="solde">0,00 €</p>
      </div>

      <div class="synthese">
        <div class="carte">
          <p>Revenus ce mois</p>
          <p id="revenus-mois">+ 0,00 €</p>
        </div>
        <div class="carte">
          <p>Dépenses ce mois</p>
          <p id="depenses-mois">- 0,00 €</p>
        </div>
      </div>

      <div class="carte">
        <h2>Transactions</h2>
        <p id="message-vide">Aucune transaction pour le moment.</p>
        <ul id="liste-transactions">
          <!-- Les lignes seront ajoutées par le JavaScript -->
        </ul>
      </div>

    </section>

    <!-- Colonne du formulaire -->
    <aside class="colonne-formulaire">
      <form id="formulaire" class="carte">
        <h2>Ajouter une transaction</h2>

        <label for="montant">Montant</label>
        <input type="number" id="montant" min="0.01" step="0.01" placeholder="0,00" required>

        <label for="categorie">Catégorie</label>
        <select id="categorie" required>
          <option value="">Sélectionner...</option>
          <option value="loyer">Loyer</option>
          <option value="courses">Courses</option>
          <option value="transport">Transport</option>
          <option value="loisirs">Loisirs</option>
          <option value="abonnements">Abonnements</option>
          <option value="autres">Autres</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" required>

        <label for="libelle">Libellé</label>
        <input type="text" id="libelle" placeholder="Ex. : courses du mois" required>

        <div class="toggle-type">
          <label>
            <input type="radio" name="type" value="revenu">
            <span>Revenu</span>
          </label>
          <label>
            <input type="radio" name="type" value="depense" checked>
            <span>Dépense</span>
          </label>
        </div>

        <button type="submit">Ajouter</button>
      </form>
    </aside>

  </main>

</body>
</html>
